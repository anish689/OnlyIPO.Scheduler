name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: local-ci-test
          POSTGRES_DB: onlyipo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      ONLYIPO_TEST_DATABASE: Host=localhost;Database=onlyipo_test;Username=postgres;Password=local-ci-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IPOOnly.Scheduler.sln

      - name: Build
        run: dotnet build IPOOnly.Scheduler.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test IPOOnly.Scheduler.sln --configuration Release --no-build
