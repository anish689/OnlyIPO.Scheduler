name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IPOOnly.Scheduler.slnx

      - name: Build
        run: dotnet build IPOOnly.Scheduler.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test IPOOnly.Scheduler.slnx --configuration Release --no-build
