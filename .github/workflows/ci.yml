name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backup-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install rehearsal tools
        run: bash scripts/backup/install-tools.sh
      - name: Fictional backup, restore, encryption and failure-path tests
        env:
          BACKUP_TEST_PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -m unittest discover -s scripts/backup -p 'test_*.py' -v

  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: local-ci-test
          POSTGRES_DB: onlyipo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      ONLYIPO_TEST_DATABASE: Host=localhost;Database=onlyipo_test;Username=postgres;Password=local-ci-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IPOOnly.Scheduler.sln

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Monitoring and workflow policy tests
        run: node --test scripts/refresh-health.test.mjs scripts/workflow-contract.test.mjs scripts/backup/health.test.mjs

      - name: Build
        run: dotnet build IPOOnly.Scheduler.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test IPOOnly.Scheduler.sln --configuration Release --no-build
