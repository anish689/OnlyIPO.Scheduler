name: Staging data refresh (opt-in)

on:
  workflow_dispatch:
    inputs:
      task:
        description: One-shot task (staging only)
        type: choice
        options: [ipo, tracking]
        default: ipo
        required: true
  schedule:
    # UTC: 09:47 and 18:47 India time. Best effort, not a freshness SLA.
    - cron: '17 4,13 * * *'

permissions:
  contents: read

concurrency:
  group: onlyipo-staging-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.STAGING_SCHEDULER_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish one-shot worker
        run: dotnet publish src/IPOOnly.Scheduler/IPOOnly.Scheduler.csproj -c Release -o out
      - name: Prepare verified Supabase CA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            --output /tmp/onlyipo-supabase-ca.crt
          echo '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  /tmp/onlyipo-supabase-ca.crt' | sha256sum --check --status
          openssl x509 -in /tmp/onlyipo-supabase-ca.crt -noout -checkend 86400
      - name: Refresh staging
        shell: bash
        env:
          DOTNET_ENVIRONMENT: Staging
          ConnectionStrings__IPOOnlyDatabase: ${{ secrets.STAGING_DATABASE_CONNECTION }}
          Upstox__AnalyticsToken: ${{ secrets.STAGING_UPSTOX_TOKEN }}
          DocumentEnrichment__Enabled: 'false'
          Financials__Enabled: 'false'
          TASK: ${{ inputs.task || 'ipo' }}
        run: |
          set -euo pipefail
          test -n "$ConnectionStrings__IPOOnlyDatabase" || { echo 'Missing staging database secret'; exit 1; }
          test -n "$Upstox__AnalyticsToken" || { echo 'Missing staging provider secret'; exit 1; }
          cd out
          case "$TASK" in
            ipo) dotnet IPOOnly.Scheduler.dll --run-once ;;
            tracking) dotnet IPOOnly.Scheduler.dll --tracking-once ;;
            *) echo 'Unsupported task'; exit 1 ;;
          esac
