name: Production data refresh (opt-in)

on:
  workflow_dispatch:
    inputs:
      task:
        description: Production partition to refresh after connection verification
        type: choice
        options: [all, open, upcoming, closed, listed, tracking, financials]
        default: open
        required: true
  schedule:
    # UTC: 12:37 and 21:37 India time; separated from staging's bounded cycles.
    - cron: '7 7,16 * * *'

permissions:
  contents: read

concurrency:
  group: youripo-production-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PRODUCTION_SCHEDULER_ENABLED == 'true')
    environment: production
    runs-on: ubuntu-latest
    # The full listed catalogue is larger than the active IPO partitions.
    timeout-minutes: ${{ matrix.status == 'financials' && 50 || matrix.status == 'tracking' && 30 || matrix.status == 'listed' && 20 || 10 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        status: ${{ fromJSON(github.event_name == 'schedule' && '["open","upcoming","closed","listed","tracking","financials"]' || inputs.task == 'all' && '["open","upcoming","closed","listed","tracking","financials"]' || format('["{0}"]', inputs.task)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish one-shot worker
        run: dotnet publish src/IPOOnly.Scheduler/IPOOnly.Scheduler.csproj -c Release -o out
      - name: Prepare verified Supabase CA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            --output /tmp/onlyipo-supabase-ca.crt
          echo '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  /tmp/onlyipo-supabase-ca.crt' | sha256sum --check --status
          openssl x509 -in /tmp/onlyipo-supabase-ca.crt -noout -checkend 86400
      - name: Refresh production
        shell: bash
        env:
          DOTNET_ENVIRONMENT: Production
          DeploymentTarget: production
          ConnectionStrings__IPOOnlyDatabase: ${{ secrets.PRODUCTION_DATABASE_CONNECTION }}
          Upstox__AnalyticsToken: ${{ secrets.PRODUCTION_UPSTOX_TOKEN }}
          DocumentEnrichment__Enabled: 'false'
          Financials__Enabled: ${{ matrix.status == 'financials' && 'true' || 'false' }}
          Financials__SkipFresh: 'true'
          Tracking__IncludeWatchlisted: 'false'
          TASK: ${{ matrix.status }}
          Scheduler__Statuses__0: ${{ (matrix.status == 'tracking' || matrix.status == 'financials') && 'listed' || matrix.status }}
          Scheduler__Statuses__1: ${{ (matrix.status == 'tracking' || matrix.status == 'financials') && 'listed' || matrix.status }}
          Scheduler__Statuses__2: ${{ (matrix.status == 'tracking' || matrix.status == 'financials') && 'listed' || matrix.status }}
          Scheduler__Statuses__3: ${{ (matrix.status == 'tracking' || matrix.status == 'financials') && 'listed' || matrix.status }}
        run: |
          set -euo pipefail
          test -n "$ConnectionStrings__IPOOnlyDatabase" || { echo 'Missing production database secret'; exit 1; }
          test -n "$Upstox__AnalyticsToken" || { echo 'Missing production provider secret'; exit 1; }
          cd out
          case "$TASK" in
            open|upcoming|closed|listed) dotnet IPOOnly.Scheduler.dll --run-once ;;
            tracking) dotnet IPOOnly.Scheduler.dll --tracking-once ;;
            financials) dotnet IPOOnly.Scheduler.dll --financials-backfill ;;
            *) echo 'Unsupported task'; exit 1 ;;
          esac
